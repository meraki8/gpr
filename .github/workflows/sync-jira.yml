name: Jira sync

on:
  workflow_dispatch:           # allow manual trigger from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit cron endpoint
        env:
          CRON_URL: ${{ vars.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_URL" ]; then
            echo "::error::CRON_URL repo variable not set (e.g. https://gpr-phi.vercel.app/api/cron/sync-jira)"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET repo secret not set"
            exit 1
          fi
          curl -sS -X POST -H "Authorization: Bearer $CRON_SECRET" "$CRON_URL" | tee response.json
          echo
          jq -e '.ok == true' response.json
